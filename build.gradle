buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

group = 'com.carrot123.waterworld'
version = mod_version
base.archivesName = 'waterworld'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                waterworld { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup('top.theillusivec4.curios') }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeModule('curse.maven', 'thirst-was-taken-679270')
            includeModule('curse.maven', 'the-lost-cities-269024')
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    implementation fg.deobf('curse.maven:the-lost-cities-269024:9730699')
    compileOnly fg.deobf('curse.maven:thirst-was-taken-679270:6660408')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'waterworld.refmap.json'
    config 'waterworld.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'MixinConfigs': 'waterworld.mixins.json',
        'Implementation-Title': '海洋世界',
        'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}
